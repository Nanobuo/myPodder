name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    # L'app desktop ha il suo workflow (desktop.yml).
    paths-ignore: ["desktop/**", ".github/workflows/desktop.yml", "docs/release-notes/desktop-*"]
  pull_request:
    paths-ignore: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # Verifica le credenziali di Podcast Index (Repository secrets): senza, l'app usa iTunes
      # e mancano tendenze e ricerca per persona.
      - name: Check Podcast Index credentials
        env:
          KEY: ${{ secrets.PODCASTINDEX_KEY }}
          SECRET: ${{ secrets.PODCASTINDEX_SECRET }}
        run: |
          if [ -z "$KEY" ] || [ -z "$SECRET" ]; then
            echo "::warning title=Podcast Index::Repository secrets PODCASTINDEX_KEY/PODCASTINDEX_SECRET missing: the app falls back to iTunes search."
            exit 0
          fi
          NOW=$(date +%s); HASH=$(printf '%s' "$KEY$SECRET$NOW" | sha1sum | cut -d' ' -f1)
          RESP=$(curl -s -G "https://api.podcastindex.org/api/1.0/search/byperson" --data-urlencode "q=Fedez" -d max=40 \
            -H "User-Agent: myPodder-ci" -H "X-Auth-Key: $KEY" -H "X-Auth-Date: $NOW" -H "Authorization: $HASH")
          SUMMARY=$(printf '%s' "$RESP" | python3 -c "import sys,json
          try:
              d=json.load(sys.stdin)
          except Exception:
              print('invalid response'); sys.exit()
          feeds=[]
          for i in d.get('items',[]):
              t=i.get('feedTitle')
              if t and t not in feeds: feeds.append(t)
          print('status', d.get('status'), '- byperson Fedez:', len(d.get('items',[])), 'episodes,', '; '.join(feeds[:6]))")
          echo "::notice title=Podcast Index::$SUMMARY"

      - name: Build debug APK
        env:
          PODCASTINDEX_KEY: ${{ secrets.PODCASTINDEX_KEY }}
          PODCASTINDEX_SECRET: ${{ secrets.PODCASTINDEX_SECRET }}
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee -a build.log

      # Verifica che anche la build di release (R8 e lint) compili; l'APK qui non è firmato.
      - name: Check release build
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee -a build.log

      - name: Unit test
        if: success() || failure()
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee -a build.log

      # Riassume gli errori in un'unica annotazione, leggibile anche senza scaricare i log.
      - name: Report errors
        if: failure()
        run: |
          errors=$(grep -E -A2 "^e: |error:|What went wrong|^> |FAILED|Exception:|^ *[0-9]+\. Dependency" build.log \
            | grep -v "^> Task" | head -c 60000 || true)
          errors="${errors//'%'/'%25'}"
          errors="${errors//$'\n'/'%0A'}"
          echo "::error title=Build errors::${errors}"

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/myPodder-debug-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: myPodder-debug
          path: out/*.apk

      # Su ogni push su main aggiorna la release "latest-debug", così l'APK si scarica
      # direttamente dal telefono senza fare login su GitHub.
      - name: Publish latest debug release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug out/*.apk \
            --title "Ultima build di debug" \
            --notes "Build automatica del commit ${GITHUB_SHA::7}." \
            --prerelease --target "$GITHUB_SHA"

  # Pubblica una release firmata quando su main arriva un versionName non ancora rilasciato
  # (oppure su un tag v*). Il tag viene creato da GitHub insieme alla release.
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          tag="v${version}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already published, nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        if: steps.version.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5
        if: steps.version.outputs.publish == 'true'

      - name: Decode signing key
        if: steps.version.outputs.publish == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error title=Signing key missing::Add RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD and RELEASE_KEY_ALIAS to the repository secrets."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | LC_ALL=C tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        if: steps.version.outputs.publish == 'true'
        env:
          PODCASTINDEX_KEY: ${{ secrets.PODCASTINDEX_KEY }}
          PODCASTINDEX_SECRET: ${{ secrets.PODCASTINDEX_SECRET }}
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RAW_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RAW_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RAW_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          # Toglie spazi, a capo e caratteri invisibili finiti nei Secrets durante il copia-incolla.
          clean() { printf '%s' "$1" | LC_ALL=C tr -cd '[:graph:]'; }
          export RELEASE_KEYSTORE_PASSWORD="$(clean "$RAW_STORE_PASSWORD")"
          export RELEASE_KEY_ALIAS="$(clean "$RAW_KEY_ALIAS")"
          export RELEASE_KEY_PASSWORD="$(clean "$RAW_KEY_PASSWORD")"
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Report errors
        if: failure()
        run: |
          errors=$(grep -E -A2 "^e: |error:|Error:|What went wrong|^> |FAILED|Exception:" build.log \
            | grep -v "^> Task" | head -c 60000 || true)
          errors="${errors//'%'/'%25'}"
          errors="${errors//$'\n'/'%0A'}"
          echo "::error title=Build errors::${errors}"

      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          apk="myPodder-${tag}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          notes="docs/release-notes/${tag}.md"
          [ -f "$notes" ] || notes=/dev/null
          gh release create "$tag" "$apk" --title "myPodder ${tag#v}" --notes-file "$notes" --latest --target "$GITHUB_SHA"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
