name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit test
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        env:
          PODCASTINDEX_KEY: ${{ secrets.PODCASTINDEX_KEY }}
          PODCASTINDEX_SECRET: ${{ secrets.PODCASTINDEX_SECRET }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/myPodder-debug-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: myPodder-debug
          path: out/*.apk

      # Su ogni push su main aggiorna la release "latest-debug", così l'APK si scarica
      # direttamente dal telefono senza fare login su GitHub.
      - name: Publish latest debug release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug out/*.apk \
            --title "Ultima build di debug" \
            --notes "Build automatica del commit ${GITHUB_SHA::7}." \
            --prerelease --target "$GITHUB_SHA"
