name: Desktop

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: desktop

jobs:
  # Controlli veloci (tipi, test, build del frontend) e decisione sulla release.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

      # Stesso numero di versione dell'app Android.
      - name: Version
        id: version
        working-directory: .
        run: echo "version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: "--bundles nsis"
          - os: macos-latest
            name: macos
            args: "--target universal-apple-darwin --bundles dmg"
          - os: ubuntu-24.04
            name: linux
            args: "--bundles appimage,deb"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Linux dependencies
        if: matrix.name == 'linux'
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update -q
          sudo -E apt-get install -y -q --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - run: npm ci

      - name: Build
        shell: bash
        env:
          APP_VERSION: ${{ needs.check.outputs.version }}
          VITE_PODCASTINDEX_KEY: ${{ secrets.PODCASTINDEX_KEY }}
          VITE_PODCASTINDEX_SECRET: ${{ secrets.PODCASTINDEX_SECRET }}
        run: npx tauri build ${{ matrix.args }} --config "{\"version\":\"$APP_VERSION\"}"

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p ../out
          find src-tauri/target -path '*/release/bundle/*' \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} ../out/ \;
          ls -la ../out

      - uses: actions/upload-artifact@v7
        with:
          name: myPodder-desktop-${{ matrix.name }}
          path: out/*

  publish:
    needs: [check, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      # Build di prova sempre aggiornata, mai "latest": le versioni ufficiali (con APK e
      # installer desktop insieme) le pubblica release.yml.
      - name: Update desktop-latest
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete desktop-latest --yes --cleanup-tag || true
          gh release create desktop-latest out/* \
            --title "myPodder Desktop · ultima build" \
            --notes "Build automatica del commit ${GITHUB_SHA::7}, versione ${{ needs.check.outputs.version }}." \
            --prerelease --latest=false --target "$GITHUB_SHA"
