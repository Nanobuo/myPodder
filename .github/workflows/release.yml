name: Release

# Release unica per Android e desktop: quando su main arriva un versionName (app/build.gradle.kts)
# non ancora pubblicato, compila l'APK firmato e gli installer per Windows, macOS e Linux e li
# pubblica tutti insieme nella release vX.Y.Z, con le note di docs/release-notes/vX.Y.Z.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - name: Check version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$version already published, nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  android:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error title=Signing key missing::Add RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD and RELEASE_KEY_ALIAS to the repository secrets."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | LC_ALL=C tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          PODCASTINDEX_KEY: ${{ secrets.PODCASTINDEX_KEY }}
          PODCASTINDEX_SECRET: ${{ secrets.PODCASTINDEX_SECRET }}
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RAW_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RAW_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RAW_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          # Toglie spazi, a capo e caratteri invisibili finiti nei Secrets durante il copia-incolla.
          clean() { printf '%s' "$1" | LC_ALL=C tr -cd '[:graph:]'; }
          export RELEASE_KEYSTORE_PASSWORD="$(clean "$RAW_STORE_PASSWORD")"
          export RELEASE_KEY_ALIAS="$(clean "$RAW_KEY_ALIAS")"
          export RELEASE_KEY_PASSWORD="$(clean "$RAW_KEY_PASSWORD")"
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Report errors
        if: failure()
        run: |
          errors=$(grep -E -A2 "^e: |error:|Error:|What went wrong|^> |FAILED|Exception:" build.log \
            | grep -v "^> Task" | head -c 60000 || true)
          errors="${errors//'%'/'%25'}"
          errors="${errors//$'\n'/'%0A'}"
          echo "::error title=Build errors::${errors}"

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/myPodder-v${{ needs.version.outputs.version }}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: out/*

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  desktop:
    needs: version
    if: needs.version.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: "--bundles nsis"
          - os: macos-latest
            name: macos
            args: "--target universal-apple-darwin --bundles app,dmg"
          - os: ubuntu-24.04
            name: linux
            args: "--bundles appimage,deb"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - name: Linux dependencies
        if: matrix.name == 'linux'
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update -q
          sudo -E apt-get install -y -q --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - run: npm ci

      - name: Build
        shell: bash
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
          VITE_PODCASTINDEX_KEY: ${{ secrets.PODCASTINDEX_KEY }}
          VITE_PODCASTINDEX_SECRET: ${{ secrets.PODCASTINDEX_SECRET }}
          # Chiave che firma gli aggiornamenti in-app (la pubblica è in tauri.conf.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            config="{\"version\":\"$APP_VERSION\",\"bundle\":{\"createUpdaterArtifacts\":true}}"
          else
            echo "::warning title=Updater::TAURI_SIGNING_PRIVATE_KEY missing: no in-app update for this release."
            config="{\"version\":\"$APP_VERSION\"}"
          fi
          npx tauri build ${{ matrix.args }} --config "$config"

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p ../out
          find src-tauri/target -path '*/release/bundle/*' \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.app.tar.gz' -o -name '*.sig' \) \
            -exec cp {} ../out/ \;
          ls -la ../out

      - uses: actions/upload-artifact@v7
        with:
          name: release-desktop-${{ matrix.name }}
          path: out/*

  publish:
    needs: [version, android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          path: out
          pattern: release-*
          merge-multiple: true

      # latest.json per l'aggiornamento in-app del desktop: indica, per ogni sistema, il file da
      # scaricare e la sua firma. Le firme finiscono nel file, non tra gli asset della release.
      - name: Updater manifest
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mac=$(ls out/*.app.tar.gz 2>/dev/null | head -1 || true)
          if [ -n "$mac" ]; then
            mv "$mac" "out/myPodder_${VERSION}_universal.app.tar.gz"
            if [ -f "$mac.sig" ]; then mv "$mac.sig" "out/myPodder_${VERSION}_universal.app.tar.gz.sig"; fi
          fi
          python3 - <<'PY'
          import glob, json, os, datetime
          v = os.environ["VERSION"]
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/v{v}/"
          def entry(pattern):
              for f in glob.glob("out/" + pattern):
                  if os.path.exists(f + ".sig"):
                      return {"signature": open(f + ".sig").read().strip(), "url": base + os.path.basename(f)}
          platforms = {}
          win, mac, lin = entry("*-setup.exe"), entry("*.app.tar.gz"), entry("*.AppImage")
          if win: platforms["windows-x86_64"] = win
          if mac: platforms["darwin-aarch64"] = platforms["darwin-x86_64"] = mac
          if lin: platforms["linux-x86_64"] = lin
          if platforms:
              notes_file = f"docs/release-notes/v{v}.md"
              notes = open(notes_file).read() if os.path.exists(notes_file) else ""
              json.dump({"version": v, "notes": notes,
                         "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                         "platforms": platforms}, open("out/latest.json", "w"), indent=2)
              print("latest.json:", ", ".join(platforms))
          else:
              print("No signed updater artifacts: latest.json not created.")
          PY
          rm -f out/*.sig

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.version.outputs.version }}"
          notes="docs/release-notes/${tag}.md"
          [ -f "$notes" ] || notes=/dev/null
          ls -la out
          gh release create "$tag" out/* --title "myPodder ${tag#v}" --notes-file "$notes" --latest --target "$GITHUB_SHA"
